<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<title>후계동 밤골목 · 문을 여는 값</title>
<style>
:root{
  --bg:#05070a; --bg2:#080d11; --panel:#0a1216; --panel2:#0d181d;
  --ink:#dfeee9; --dim:#8299a0; --line:#1e3038; --line2:#2c4650;
  --mint:#5ef2c0; --mint2:#2fbf94; --amber:#ffc85e; --red:#ff5468; --blue:#7fc4ff;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --sans: "DungGeunMo","Galmuri11","Malgun Gothic","Apple SD Gothic Neo",-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:#000;color:var(--ink);font-family:var(--sans);
  overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;}
body{display:flex;justify-content:center;}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;font-size:inherit;}
body.v-title #hud,body.v-title #truthBar{display:none;}
#app{
  position:relative;width:100%;max-width:430px;height:100%;height:100dvh;
  display:flex;flex-direction:column;background:var(--bg);overflow:hidden;
  box-shadow:0 0 40px rgba(0,0,0,.9);
}
/* ---------- HUD ---------- */
#hud{
  flex:0 0 auto;height:44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;background:linear-gradient(180deg,#0b1418,#070d10);border-bottom:1px solid var(--line);
  position:relative;z-index:20;
}
.hud-l{display:flex;align-items:center;gap:7px;min-width:0;}
.hud-l .led{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 7px var(--mint);animation:led 2.4s infinite;}
@keyframes led{0%,100%{opacity:1}50%{opacity:.35}}
#hudTitle{font-size:12.5px;letter-spacing:.4px;color:#bcd6d0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#hudChapter{font-size:10.5px;color:var(--dim);margin-left:2px;}
.hud-r{display:flex;align-items:center;gap:8px;}
#hudClock{font-family:var(--mono);font-size:11.5px;color:var(--amber);letter-spacing:.5px;}
#btnMenu{width:32px;height:30px;border:1px solid var(--line2);border-radius:4px;font-size:13px;color:#9fb9b4;background:#0c171b;}
#btnMenu:active{background:#132a30;}
/* ---------- truth bar ---------- */
#truthBar{flex:0 0 auto;height:20px;display:flex;align-items:center;gap:6px;padding:0 12px;
  background:#070e11;border-bottom:1px solid #14232a;}
#truthBar .lb{font-size:9.5px;color:var(--dim);letter-spacing:1px;}
#truthDots{display:flex;gap:3px;}
#truthDots i{width:9px;height:5px;background:#1b2c33;border-radius:1px;transition:background .25s,box-shadow .25s;}
#truthDots i.on{background:var(--mint);box-shadow:0 0 5px rgba(94,242,192,.7);}
#truthDots i.warn{background:var(--red);box-shadow:0 0 5px rgba(255,84,104,.7);}
#truthVal{margin-left:auto;font-family:var(--mono);font-size:10px;color:#6f8b86;}
/* ---------- stage ---------- */
#stage{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
#gameView{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;}
#art{position:relative;flex:0 0 auto;height:31vh;min-height:160px;max-height:280px;overflow:hidden;background:#000;
  border-bottom:1px solid #12232a;}
#bgImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%;
  filter:saturate(1.02) contrast(1.03);opacity:0;transition:opacity .45s ease;}
#bgImg.on{opacity:1;}
#artGrad{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(3,6,8,.55) 0%,rgba(3,6,8,0) 30%,rgba(3,6,8,.15) 62%,rgba(3,6,8,.92) 100%);}
#scan{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.30) 0 1px,rgba(0,0,0,0) 1px 3px);}
#grid{position:absolute;inset:0;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(90deg,rgba(120,255,220,.06) 0 1px,rgba(0,0,0,0) 1px 3px);}
.corner{position:absolute;width:14px;height:14px;border:2px solid rgba(94,242,192,.55);z-index:4;}
.corner.tl{top:8px;left:8px;border-right:0;border-bottom:0;}
.corner.tr{top:8px;right:8px;border-left:0;border-bottom:0;}
.corner.bl{bottom:8px;left:8px;border-right:0;border-top:0;}
.corner.br{bottom:8px;right:8px;border-left:0;border-top:0;}
#artTag{position:absolute;left:12px;top:10px;z-index:5;font-size:10.5px;letter-spacing:1.5px;color:#9ff3d5;
  background:rgba(4,10,12,.62);border:1px solid rgba(94,242,192,.35);padding:3px 8px;border-radius:2px;}
#bustWrap{position:absolute;right:2%;bottom:0;width:44%;max-width:190px;z-index:3;pointer-events:none;
  opacity:0;transform:translateY(10px);transition:opacity .28s ease,transform .28s ease;}
#bustWrap.on{opacity:1;transform:translateY(0);}
#bustImg{width:100%;display:block;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 62%,rgba(0,0,0,.25) 88%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 0%,#000 62%,rgba(0,0,0,.25) 88%,transparent 100%);
  filter:drop-shadow(0 0 18px rgba(0,0,0,.9)) contrast(1.05) saturate(1.02);}
#hotspots{position:absolute;inset:0;z-index:6;}
.hs{position:absolute;transform:translate(-50%,-50%);width:52px;height:52px;display:flex;align-items:center;justify-content:center;}
.hs .ring{position:absolute;inset:6px;border:1px solid rgba(94,242,192,.8);border-radius:50%;
  animation:pulse 1.7s infinite;}
.hs .ring:nth-child(2){animation-delay:.85s;}
@keyframes pulse{0%{transform:scale(.55);opacity:.95}100%{transform:scale(1.45);opacity:0}}
.hs .core{position:relative;width:22px;height:22px;background:rgba(6,16,18,.86);border:1px solid var(--mint);
  border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--mint);
  box-shadow:0 0 10px rgba(94,242,192,.5);}
.hs.done .core{background:rgba(30,60,50,.9);border-color:#3d6d5c;color:#7fd6b4;box-shadow:none;}
.hs.done .ring{display:none;}
.hs .lbl{position:absolute;top:44px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:9.5px;
  color:#cfe9e2;background:rgba(3,10,12,.78);border:1px solid #1e3a36;padding:1px 6px;border-radius:2px;}
.hs.done .lbl{color:#7fa79b;}
.hs.up .lbl{top:auto;bottom:44px;}
#art .hitfx{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9;}
#art .hitfx.flash{animation:flash .22s ease-out;}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
/* ---------- panel ---------- */
#panel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;position:relative;
  background:linear-gradient(180deg,#080f13 0%,#05090b 100%);
  padding-bottom:env(safe-area-inset-bottom,0px);}
/* VN */
.vn-name{display:flex;align-items:center;gap:7px;padding:0 2px 6px;border-bottom:1px solid #17282e;margin-bottom:2px;}
.vn-name b{font-size:14px;letter-spacing:.2px;color:var(--mint);text-shadow:0 0 10px rgba(94,242,192,.35);}
.vn-name span{font-size:10px;color:var(--dim);border:1px solid var(--line2);padding:1px 5px;border-radius:2px;}
.vn-box{flex:0 0 auto;max-height:48vh;min-height:132px;display:flex;flex-direction:column;position:relative;margin:8px 10px 10px;
  border:1px solid #274046;border-radius:3px;background:linear-gradient(180deg,rgba(13,25,29,.97),rgba(5,11,14,.97));
  box-shadow:inset 0 0 46px rgba(0,0,0,.65),0 2px 0 #000;padding:9px 12px 7px;overflow:hidden;}
.vn-box:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--mint),rgba(94,242,192,0));}
.vn-text{flex:1 1 auto;min-height:56px;overflow-y:auto;padding:4px 2px 6px;font-size:14.5px;line-height:1.86;
  letter-spacing:-.2px;color:#e6f4ef;word-break:keep-all;}
.vn-text.nar{color:#a9c4be;}
.vn-text .nar{color:#a9c4be;font-style:normal;}
.vn-foot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:4px 2px 0;}
.tap-hint{font-size:10px;color:#6c8b84;letter-spacing:.6px;animation:blink 1.4s infinite;}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
.mini-btn{font-size:10.5px;color:#9ab8b1;border:1px solid var(--line2);padding:3px 8px;border-radius:3px;background:#0a1518;}
.choices{display:flex;flex-direction:column;gap:7px;padding:2px 12px 12px;flex:0 0 auto;}
.choice{position:relative;display:block;width:100%;text-align:left;padding:11px 12px 11px 30px;border:1px solid var(--line2);
  background:linear-gradient(180deg,#0d1a1f,#0a1317);border-radius:3px;font-size:13.5px;line-height:1.5;
  box-shadow:0 2px 0 #000;transition:transform .08s,border-color .15s,background .15s;}
.choice:before{content:"";position:absolute;left:13px;top:50%;width:6px;height:6px;margin-top:-3px;
  background:var(--mint);transform:rotate(45deg);opacity:.75;}
.choice:active{transform:translateY(2px);border-color:var(--mint);background:#102a28;}
.choice .sub{display:block;font-size:10.5px;color:var(--dim);margin-top:2px;}
/* generic panel blocks */
.sec{padding:10px 12px 0;}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:0 2px 7px;}
.sec-h b{font-size:11px;letter-spacing:1.6px;color:#8fc7b7;}
.sec-h span{font-size:10px;color:var(--dim);}
.rule{height:1px;background:linear-gradient(90deg,rgba(94,242,192,.35),rgba(94,242,192,0));margin:0 12px;}
/* investigate */
.inv-nar{padding:9px 14px 4px;font-size:12.5px;line-height:1.7;color:#a9c4be;min-height:46px;word-break:keep-all;}
.inv-foot{margin-top:auto;flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;padding:6px 12px 12px;}
.btn{position:relative;padding:11px 8px;border:1px solid var(--line2);border-radius:3px;
  background:linear-gradient(180deg,#101e23,#0a1317);font-size:12.5px;letter-spacing:-.2px;
  box-shadow:0 2px 0 #000;transition:transform .08s,border-color .15s;}
.btn:active{transform:translateY(2px);}
.btn.pri{border-color:var(--mint);color:#062; background:linear-gradient(180deg,#5ef2c0,#2fbf94);font-weight:700;color:#04231b;
  box-shadow:0 2px 0 #05221a, 0 0 14px rgba(94,242,192,.35);}
.btn.gold{border-color:var(--amber);color:#1c1402;background:linear-gradient(180deg,#ffd98b,#f0b23c);font-weight:700;
  box-shadow:0 2px 0 #33240a,0 0 14px rgba(255,200,94,.3);}
.btn.ghost{color:#a8c6bf;}
.btn:disabled{opacity:.38;}
.btn .n{display:block;font-family:var(--mono);font-size:9.5px;color:#7fa79b;margin-top:2px;}
/* inv tip */
.inv-tip{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px 14px;}
.inv-tip div{border:1px dashed #22403c;border-radius:3px;padding:10px 12px;font-size:11px;line-height:1.75;
  color:#8fb0a9;background:rgba(6,16,18,.6);text-align:center;max-width:320px;}
.inv-tip b{color:#5ef2c0;font-weight:400;}
/* clue slots */
.slots{display:flex;flex-direction:column;gap:5px;padding:8px 12px 0;overflow-y:auto;min-height:0;}
.slot{display:flex;align-items:center;gap:8px;padding:6px 9px;border:1px solid #1c2f36;border-radius:2px;background:#081114;font-size:11.5px;color:#6f8c86;}
.slot .idx{font-family:var(--mono);font-size:9px;color:#3f5b58;}
.slot .nm{flex:1;color:#c3ded6;}
.slot .kd{font-size:9px;color:#6f9c8e;border:1px solid #24403c;padding:0 4px;border-radius:2px;}
.slot.found{border-color:#2b4a48;background:#0a1a19;}
.slot.found .nm{color:#e2fff6;}
.slot.found .idx{color:var(--mint);}
/* clue chips */
.chips{display:flex;gap:5px;padding:6px 12px 0;flex-wrap:wrap;}
.chip{font-size:10px;padding:3px 7px;border:1px solid #2b4a48;border-radius:2px;color:#9fe0c8;background:#0a1a19;}
.chip.b{color:#ffd28a;border-color:#5a4520;background:#1a1408;}
/* notebook */
.nb-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:8px 12px 14px;}
.nb-hint{font-size:11px;line-height:1.6;color:#8fb0a9;padding:2px 2px 8px;}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.card{position:relative;padding:8px 9px;border:1px solid var(--line2);border-radius:3px;background:#0b1519;text-align:left;
  box-shadow:0 2px 0 #000;}
.card .t{font-size:12px;line-height:1.35;color:#dff1ea;display:block;}
.card .k{font-size:9px;letter-spacing:1px;color:#79a196;display:block;margin-top:3px;}
.card.sel{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint),0 0 12px rgba(94,242,192,.3);}
.card.ded{border-color:#665020;background:#171204;}
.card.ded .k{color:#c9a45f;}
.card .mk{position:absolute;top:6px;right:7px;font-size:9px;color:var(--mint);}
.nb-bar{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:8px 12px 12px;border-top:1px solid #12232a;background:#060d10;}
.combo-out{font-size:12px;line-height:1.65;color:#ffd9a0;background:rgba(60,44,10,.35);border:1px solid #5a4520;
  border-radius:3px;padding:9px 10px;margin:8px 0 4px;}
/* court */
.stmts{flex:1 1 auto;overflow-y:auto;padding:4px 12px 10px;display:flex;flex-direction:column;gap:8px;}
.stmt{position:relative;text-align:left;padding:11px 12px;border:1px solid var(--line2);border-left:3px solid #3d6d5c;
  background:#0b1519;border-radius:2px;font-size:13px;line-height:1.6;color:#dcece7;}
.stmt:active{border-color:var(--mint);}
.stmt.hit{border-left-color:#3a4a50;color:#5f7a74;text-decoration:line-through;}
.stmt .who{display:block;font-size:9.5px;color:#6f9c8e;letter-spacing:1px;margin-bottom:3px;}
.court-head{padding:9px 14px 4px;font-size:11.5px;color:#a9c4be;line-height:1.6;}
.court-head b{color:var(--amber);}
/* court note */
.court-note{font-size:10px;color:#6f8c86;padding:6px 14px 8px;border-top:1px dashed #1b2f35;margin-top:auto;line-height:1.6;}
/* evidence sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;z-index:60;
  background:#081114;border-top:2px solid var(--mint);border-radius:8px 8px 0 0;
  padding:10px 12px calc(14px + env(safe-area-inset-bottom,0px));transform:translateY(102%);
  transition:transform .26s cubic-bezier(.2,.9,.2,1);max-height:70%;display:flex;flex-direction:column;}
.sheet.on{transform:translateY(0);}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;}
.sheet-h b{font-size:12px;letter-spacing:1.4px;color:var(--mint);}
.sheet-list{overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-bottom:4px;}
.sheet-item{text-align:left;padding:9px 10px;border:1px solid var(--line2);border-radius:3px;background:#0b1519;font-size:12.5px;}
.sheet-item:active{border-color:var(--mint);background:#102a28;}
.sheet-item .d{display:block;font-size:10px;color:#7fa79b;margin-top:2px;line-height:1.45;}
/* battle */
body.v-battle #art,body.v-vn #art{flex:1 1 auto;height:auto;max-height:none;min-height:170px;}
body.v-invest #art{height:39vh;max-height:360px;min-height:240px;}
body.v-vn #panel,body.v-battle #panel{flex:0 0 auto;}
body.v-battle #artTag{display:none;}
.enemy{position:absolute;inset:0;z-index:3;display:flex;align-items:flex-end;justify-content:center;padding:6px 0 2%;pointer-events:none;}
.enemy img{height:86%;max-height:100%;object-fit:contain;opacity:.95;
  filter:brightness(1.75) saturate(1.15) drop-shadow(0 0 16px rgba(168,86,255,.55)) drop-shadow(0 0 42px rgba(120,40,180,.35));
  transition:transform .12s,filter .12s;}
.enemy.hurt img{transform:translateX(9px) scale(.97);filter:brightness(3.2) saturate(.4) drop-shadow(0 0 20px #ff5468);}
.enemy.stagger img{filter:brightness(1.35) saturate(.6) drop-shadow(0 0 22px #ffc85e);transform:translateY(10px) scale(.96);}
.enemy-hud{position:absolute;top:0;left:0;right:0;z-index:7;pointer-events:none;padding:6px 12px 7px;
  background:linear-gradient(180deg,rgba(3,7,10,.92),rgba(3,7,10,.55) 75%,rgba(3,7,10,0));}
.eh-top{display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;color:#e8d5ff;}
.eh-name{letter-spacing:1px;font-size:11.5px;color:#f0e2ff;text-shadow:0 0 10px rgba(180,120,255,.6);}
.bar{position:relative;height:7px;background:#141a1e;border:1px solid #2a3540;border-radius:1px;overflow:hidden;margin-top:3px;}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0%;transition:width .4s cubic-bezier(.2,.9,.2,1);}
.bar.hp i{background:linear-gradient(90deg,#ff5468,#ff8a5e);}
.bar.bk i{background:linear-gradient(90deg,#7fc4ff,#c69bff);}
.bar .tick{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.45) 0 1px,transparent 1px 12px);}
.eh-weak{margin-top:5px;display:flex;gap:5px;align-items:center;font-size:9.5px;color:#ffd28a;}
.eh-weak b{padding:1px 6px;border:1px solid #6b5320;background:rgba(80,60,10,.5);border-radius:2px;letter-spacing:1px;}
.float{position:absolute;z-index:9;font-family:var(--mono);font-weight:700;font-size:19px;color:#fff;
  text-shadow:0 0 8px #000,0 0 14px #ff5468;pointer-events:none;animation:floatUp .85s ease-out forwards;}
.float.weak{color:#ffe08a;font-size:15px;text-shadow:0 0 10px #ff9d00;}
.float.heal{color:#8dffc9;text-shadow:0 0 10px #24d18a;}
@keyframes floatUp{0%{transform:translate(-50%,0) scale(.6);opacity:0}
 18%{transform:translate(-50%,-12px) scale(1.25);opacity:1}
 100%{transform:translate(-50%,-64px) scale(1);opacity:0}}
.bt-head{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 12px 5px;border-bottom:1px solid #12232a;}
.bt-head .turn{font-size:11.5px;color:var(--mint);letter-spacing:.3px;}
.bt-head .meta{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:#6d8a84;}
.bt-log{flex:0 0 auto;height:52px;overflow:hidden;padding:4px 14px 0;font-size:11px;line-height:1.55;color:#a9c4be;}
.bt-log div{opacity:.55;}
.bt-log div:last-child{opacity:1;color:#e2f2ec;}
.bt-party{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:5px 10px 6px;}
.pcard{position:relative;padding:5px 6px;border:1px solid var(--line2);border-radius:3px;background:#0b1519;overflow:hidden;}
.pcard.act{border-color:var(--mint);box-shadow:0 0 0 1px rgba(94,242,192,.5),0 0 12px rgba(94,242,192,.25);}
.pcard.down{opacity:.45;filter:grayscale(.7);}
.pcard .pn{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:#dcece7;}
.pcard .pn em{font-style:normal;font-family:var(--mono);font-size:9.5px;color:#8fa8a2;}
.pcard .pb{height:6px;background:#12191d;border:1px solid #26333a;margin-top:4px;position:relative;}
.pcard .pb i{position:absolute;inset:0;width:100%;background:linear-gradient(90deg,#2fbf94,#5ef2c0);transition:width .3s;}
.pcard .pb i.mid{background:linear-gradient(90deg,#f0b23c,#ffd98b);}
.pcard .pb i.low{background:linear-gradient(90deg,#ff5468,#ff8a5e);}
.pcard .pt{display:flex;justify-content:space-between;font-size:8.5px;color:#7d9892;margin-top:3px;}
.bt-cmds{flex:0 0 auto;margin-top:auto;padding:6px 10px 10px;display:flex;flex-direction:column;gap:6px;}
.cmd-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.cmd{padding:9px 8px;border:1px solid var(--line2);border-radius:3px;background:linear-gradient(180deg,#101e23,#0a1317);
  text-align:left;font-size:12px;line-height:1.25;box-shadow:0 2px 0 #000;transition:transform .07s,border-color .12s;}
.cmd:active{transform:translateY(2px);border-color:var(--mint);}
.cmd .k{display:block;font-size:9px;color:#7fa79b;margin-top:2px;}
.cmd.wk{border-color:#7a5f22;background:linear-gradient(180deg,#241b07,#150f04);}
.cmd.res{grid-column:1 / -1;border-color:var(--mint);color:#04231b;background:linear-gradient(180deg,#5ef2c0,#2fbf94);font-weight:700;}
.cmd.res.off{border-color:var(--line2);color:#5b7770;background:#0a1317;font-weight:400;}
.cmd.cap{grid-column:1 / -1;border-color:var(--amber);color:#1c1402;background:linear-gradient(180deg,#ffd98b,#f0b23c);font-weight:800;
  animation:capPulse .8s infinite alternate;}
@keyframes capPulse{from{box-shadow:0 0 0 rgba(255,200,94,0)}to{box-shadow:0 0 16px rgba(255,200,94,.65)}}
.gauge{display:flex;align-items:center;gap:6px;padding:0 12px 6px;font-size:9px;color:#7fa79b;}
.gauge .g{flex:1;height:5px;background:#121a1e;border:1px solid #26333a;position:relative;}
.gauge .g i{position:absolute;inset:0;width:0%;background:linear-gradient(90deg,#2fbf94,#5ef2c0);transition:width .35s;}
/* title */
#titleScreen{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end;
  overflow:hidden;background:#000;}
#titleScreen img.tsbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 42%;
  filter:saturate(1.04) brightness(1.0);animation:tzoom 26s ease-in-out infinite alternate;transform-origin:50% 40%;}
@keyframes tzoom{from{transform:scale(1.0)}to{transform:scale(1.09)}}
#titleScreen .tsgrad{position:absolute;inset:0;background:
  radial-gradient(130% 80% at 50% 0%,rgba(0,0,0,0) 0%,rgba(3,6,8,.35) 55%,rgba(3,6,8,.9) 100%),
  linear-gradient(0deg,rgba(3,7,9,.97) 0%,rgba(3,7,9,.5) 42%,rgba(3,7,9,.05) 100%);}
.ts-body{position:relative;z-index:2;padding:0 20px calc(18px + env(safe-area-inset-bottom,0px));}
.ts-kicker{font-size:10px;letter-spacing:4px;color:#8fe6cc;text-align:center;margin-bottom:8px;}
.ts-title{font-size:33px;line-height:1.18;letter-spacing:-.5px;text-align:center;color:#f2fffb;
  text-shadow:0 0 1px #fff,0 0 14px rgba(94,242,192,.45),0 3px 0 #001a14;margin:0;}
.ts-title span{color:var(--mint);}
.ts-sub{font-size:11.5px;color:#a5c6bf;text-align:center;margin-top:9px;line-height:1.7;letter-spacing:-.1px;}
.ts-sub b{color:var(--amber);font-weight:400;}
.ts-menu{display:flex;flex-direction:column;gap:8px;margin-top:18px;}
.ts-menu .btn{padding:13px;font-size:14px;}
.ts-menu .btn:not(.pri){border-color:#2f4f4b;color:#d9efea;background:linear-gradient(180deg,#12262a,#0a161a);}
.ts-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:9.5px;color:#5f7d76;}
.ts-foot button{color:#8fb3aa;border:1px solid #26403f;border-radius:2px;padding:2px 7px;font-size:9.5px;}
#titleScreen .flick{animation:flick 5.5s infinite;}
@keyframes flick{0%,97%,100%{opacity:1}97.5%{opacity:.55}98.2%{opacity:1}98.8%{opacity:.7}}
/* overlay: objection / result / modal */
#overlay{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
  max-width:430px;margin:0 auto;}
#overlay.on{display:flex;background:rgba(2,6,8,.66);backdrop-filter:blur(1.5px);}
#objFx{position:fixed;top:0;left:0;right:0;bottom:0;z-index:85;display:none;align-items:center;justify-content:center;overflow:hidden;background:#000;}
#objFx.on{display:flex;}
#objFx .rays{position:absolute;width:200%;height:200%;
  background:repeating-conic-gradient(from 0deg,rgba(255,200,94,.22) 0deg 3deg,rgba(0,0,0,0) 3deg 8deg);
  animation:spin 6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
#objFx .txt{position:relative;z-index:2;font-size:40px;font-weight:900;letter-spacing:-1px;color:#fff;
  text-shadow:0 0 4px #000,0 0 24px #ffc85e,0 6px 0 #a35b00;animation:objPop .5s cubic-bezier(.2,1.5,.4,1);}
@keyframes objPop{0%{transform:scale(.3) rotate(-8deg);opacity:0}60%{transform:scale(1.18) rotate(2deg);opacity:1}100%{transform:scale(1)}}
#objFx .sub{position:absolute;bottom:20%;z-index:2;font-size:12.5px;color:#ffe0a8;letter-spacing:.5px;
  text-shadow:0 1px 4px #000;animation:blink 1.6s infinite;}
.card-modal{position:relative;z-index:3;width:86%;max-width:360px;background:linear-gradient(180deg,#0b171b,#070f12);
  border:1px solid var(--mint);border-radius:4px;padding:16px 15px;box-shadow:0 0 40px rgba(94,242,192,.25),0 8px 0 #000;}
.card-modal .cm-k{font-size:9.5px;letter-spacing:2px;color:var(--amber);}
.card-modal .cm-t{font-size:17px;margin:6px 0 8px;color:#f0fffa;letter-spacing:-.3px;}
.card-modal .cm-d{font-size:12.5px;line-height:1.75;color:#b9d6ce;word-break:keep-all;}
.card-modal .cm-b{margin-top:14px;}
/* result / ending */
.rp{position:absolute;inset:0;z-index:70;display:none;flex-direction:column;padding:20px 16px;
  overflow-y:auto;background-size:cover;background-position:50% 35%;background-repeat:no-repeat;}
.rp:before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.20) 0 1px,rgba(0,0,0,0) 1px 3px);}
.rp.on{display:flex;justify-content:center;}
.rp>*{position:relative;z-index:2;}
.rp-rank{text-align:center;margin-top:6px;}
.rp-rank .r{font-family:var(--mono);font-size:56px;line-height:1;color:var(--amber);text-shadow:0 0 24px rgba(255,200,94,.55);}
.rp-rank .l{font-size:10px;letter-spacing:4px;color:#8fc7b7;margin-top:6px;}
.rp-t{font-size:21px;text-align:center;margin:14px 0 4px;color:#f2fffb;letter-spacing:-.4px;text-shadow:0 2px 10px rgba(0,0,0,.9);}
.rp-s{font-size:11.5px;text-align:center;color:#c3d9d3;line-height:1.6;margin-bottom:14px;text-shadow:0 1px 3px #000;}
.rp-rows{border-top:1px solid #1e3038;border-bottom:1px solid #1e3038;padding:8px 10px;margin-bottom:14px;
  background:rgba(4,10,12,.55);backdrop-filter:blur(2px);}
.rp-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;color:#b9d6ce;}
.rp-row b{font-family:var(--mono);color:#eafff8;font-weight:400;}
.rp-row b.gold{color:var(--amber);}
.rp-msg{font-size:12.5px;line-height:1.85;color:#dcefe9;word-break:keep-all;margin-bottom:16px;
  background:rgba(4,10,12,.5);padding:10px 12px;border-radius:3px;border:1px solid rgba(40,64,70,.6);}
.rp-msg p{margin:0 0 8px;}
.rp-btns{display:flex;flex-direction:column;gap:8px;margin-top:auto;}
/* menu overlay */
#menuMask{position:fixed;inset:0;z-index:70;display:none;justify-content:center;align-items:flex-end;background:rgba(2,5,6,.72);}
#menuMask.on{display:flex;}
.menu-card{width:100%;max-width:430px;background:#081114;border-top:2px solid var(--mint);
  border-radius:8px 8px 0 0;padding:12px 14px calc(16px + env(safe-area-inset-bottom,0px));}
.menu-card h4{margin:2px 0 10px;font-size:11px;letter-spacing:2px;color:#8fc7b7;font-weight:400;}
.menu-card .row{display:flex;flex-direction:column;gap:7px;}
.menu-card .row.two{flex-direction:row;}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,10px);z-index:95;opacity:0;pointer-events:none;
  background:rgba(6,20,18,.95);border:1px solid var(--mint);color:#d9fff4;font-size:11.5px;padding:7px 13px;border-radius:20px;
  transition:opacity .2s,transform .2s;max-width:86%;text-align:center;}
#toast.on{opacity:1;transform:translate(-50%,0);}
.hidden{display:none!important;}
.shake{animation:shk .34s cubic-bezier(.36,.07,.19,.97);}
@keyframes shk{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.hitstop{animation:hs .1s steps(1);}
@keyframes hs{0%{filter:brightness(2.2) contrast(1.2)}100%{filter:none}}
</style>
</head>

  <div id="hud">
    <div class="hud-l">
      <span class="led"></span>

  </div>
  <div id="stage">
    <div id="gameView" class="hidden">
      <div id="art">
        <img id="bgImg" alt="">
        <div id="artGrad"></div>
        <div id="scan"></div>
        <div id="grid"></div>
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
        <div id="artTag">후계동 골목</div>

      </div>
      <div id="panel"></div>
    </div>
    <div id="titleScreen">
      <img class="tsbg" id="titleBg" alt="">
      <div class="tsgrad"></div>
      <div class="ts-body">

        <h1 class="ts-title flick">후계동 <span>밤골목</span></h1>
        <div class="ts-sub">제1화 · <b>문을 여는 값</b><br>세 대작이 겹치는 골목, 한 사건과 한 번의 밤</div>
        <div class="ts-menu">
          <button class="btn pri" id="btnNew">새로 시작</button>
          <button class="btn" id="btnContinue">이어서 하기</button>
          <button class="btn ghost" id="btnLoadSlot">불러오기</button>
        </div>
        <div class="ts-foot">
          <span>프로토타입 v1.0 · 390x844</span>
          <button id="btnSfx">음향 켜짐</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="overlay"></div>
<div id="objFx">
  <div class="rays"></div>
  <div class="txt">이의 있소!</div>
  <div class="sub">OBJECTION</div>
</div>
<div id="menuMask">
  <div class="menu-card">
    <h4>SYSTEM</h4>
    <div class="row">
      <button class="btn" id="mSave">저장하기</button>
      <button class="btn" id="mLoad">불러오기</button>
      <div class="row two" style="flex-direction:row">
        <button class="btn ghost" id="mSfx" style="flex:1">음향</button>
        <button class="btn ghost" id="mTitle" style="flex:1">타이틀로</button>
      </div>
      <button class="btn ghost" id="mClose">닫기</button>
    </div>
  </div>
</div>
<div id="toast"></div>

function calc(skill) {
  var e = BAT.enemy;
  var weakHit = skill.type && skill.type === e.weak;
  var d = skill.dmg || 0;
  if (weakHit) d = Math.round(d * 1.5);
  if (e.stagger > 0) d = Math.round(d * 2);
  var b = skill.brk || 0;
  if (weakHit) b = Math.round(b * 1.6);
  if (e.stagger > 0) b = 0;
  return { d: d, b: b, weak: weakHit };
}

function actSkill(skill) {
  if (BAT.busy || BAT.over) return;
  var p = BAT.party[BAT.act];
  if (!p || p.hp <= 0) return;
  BAT.busy = true;
  if (skill.heal) {
    var lowest = BAT.party.filter(function (x) { return x.hp > 0; }).sort(function (a, b) { return a.hp / a.max - b.hp / b.max; })[0] || p;
    lowest.hp = clamp(lowest.hp + skill.heal, 0, lowest.max);
    SFX.heal(); floatNum('+' + skill.heal, 'heal');
    bLog(p.n + ' · ' + skill.n + ' → ' + lowest.n + ' 회복');
    BAT.gauge = clamp(BAT.gauge + 10, 0, 100);
    renderBattle(); setTimeout(nextActor, 620); return;
  }
  var r = calc(skill);
  BAT.enemy.hp = Math.max(0, BAT.enemy.hp - r.d);
  BAT.enemy.brk = clamp(BAT.enemy.brk + r.b, 0, BAT.enemy.brkMax);
  BAT.gauge = clamp(BAT.gauge + 12 + (r.weak ? 20 : 0), 0, 100);
  if (skill.persuade) BAT.persuade = clamp(BAT.persuade + skill.persuade, 0, 9);
  bLog(p.n + ' · ' + skill.n + ' → ' + r.d + ' 피해' + (r.weak ? ' (약점)' : ''));
  SFX.hit(); flash(); hurtEnemy(); floatNum('-' + r.d, r.weak ? 'weak' : '');
  if (r.weak) setTimeout(function () { SFX.weak(); floatNum('WEAK', 'weak'); }, 120);
  renderBattle();
  setTimeout(function () {
    if (BAT.enemy.hp <= 0) { finish('win'); return; }
    if (BAT.enemy.brk >= BAT.enemy.brkMax && BAT.enemy.stagger <= 0) {
      BAT.enemy.stagger = 2; BAT.enemy.brk = BAT.enemy.brkMax;
      SFX.brk(); shake($('#art')); floatNum('BREAK', 'weak');
      bLog('브레이크! 그림자가 무릎을 꿇었다');
      renderBattle();
      setTimeout(nextActor, 700); return;
    }
    nextActor();
  }, 430);
}

function nextActor() {
  if (BAT.over) return;
  BAT.act++;
  if (BAT.act >= BAT.party.length) { enemyTurn(); return; }
  if (BAT.party[BAT.act].hp <= 0) { renderBattle(); setTimeout(nextActor, 400); return; }
  BAT.busy = false;
  updateWeak(); renderBattle();
}

function guardAct() {
  if (BAT.busy) return;
  var p = BAT.party[BAT.act];
  BAT.guard = true; BAT.busy = true;
  bLog(p.n + ' · 숨죽이기 (피해 절반)');
  BAT.gauge = clamp(BAT.gauge + 8, 0, 100);
  renderBattle(); setTimeout(nextActor, 420);
}
function itemAct() {
  if (BAT.busy || BAT.item <= 0) return;
  var p = BAT.party.filter(function (x) { return x.hp > 0; }).sort(function (a, b) { return a.hp / a.max - b.hp / b.max; })[0] || BAT.party[BAT.act];
  BAT.item--; BAT.busy = true;
  p.hp = clamp(p.hp + 30, 0, p.max);
  SFX.heal(); floatNum('+30', 'heal');
  bLog('비상식량 → ' + p.n + ' 회복');
  renderBattle(); setTimeout(nextActor, 420);
}

function resonance() {
  if (BAT.busy || BAT.gauge < 100) return;
  BAT.busy = true; BAT.gauge = 0;
  var fx = $('#objFx');
  fx.querySelector('.txt').textContent = '이의 있소!';
  fx.classList.add('on'); SFX.obj(); flash(); shake($('#app'));
  setTimeout(function () { fx.classList.remove('on'); }, 900);
  setTimeout(function () {
    var e = BAT.enemy;
    var d = 55; if (e.stagger > 0) d = Math.round(d * 2);
    e.hp = Math.max(0, e.hp - d);
    e.brk = clamp(e.brk + 35, 0, e.brkMax);
    BAT.persuade = clamp(BAT.persuade + 2, 0, 9);
    bLog('공명 · 증거 제시 → ' + d + ' 피해');
    SFX.hit(); hurtEnemy(); floatNum('-' + d, 'weak');
    renderBattle();
    setTimeout(function () {
      if (e.hp <= 0) { finish('win'); return; }
      if (e.brk >= e.brkMax && e.stagger <= 0) {
        e.stagger = 2; SFX.brk(); bLog('브레이크! 그림자가 무릎을 꿇었다'); renderBattle();
        setTimeout(nextActor, 600); return;
      }
      nextActor();
    }, 500);
  }, 900);
}

function enemyTurn() {
  if (BAT.over) return;
  BAT.act = 0; BAT.busy = true;
  updateWeak();
  var e = BAT.enemy;
  if (e.stagger > 1) {
    bLog('그림자가 흐트러져 반격하지 못한다');
    e.stagger = 1;
    setTimeout(endRound, 700); return;
  }
  var atk;
  if (BAT.turn % 3 === 0) atk = { n: '울음', all: 16 };
  else if (e.hp < 230) atk = { n: '목줄 조이기', dmg: 44, low: true };
  else atk = { n: '그림자 채찍', dmg: 34 };
  shake($('#art')); SFX.hit(); flash();
  var targets = [];
  if (atk.all) targets = BAT.party.filter(function (p) { return p.hp > 0; });
  else if (atk.low) {
    var t = BAT.party.filter(function (p) { return p.hp > 0; }).sort(function (a, b) { return a.hp - b.hp; })[0];
    if (t) targets = [t];
  } else {
    var alive = BAT.party.filter(function (p) { return p.hp > 0; });
    if (alive.length) targets = [alive[rnd(0, alive.length - 1)]];
  }
  var hitTxt = [];
  targets.forEach(function (p) {
    var d = atk.all ? atk.all : atk.dmg;
    if (BAT.guard) d = Math.round(d * 0.5);
    d = clamp(d, 1, 999);
    p.hp = Math.max(0, p.hp - d);
    hitTxt.push(p.n + ' ' + d);
    if (p.hp <= 0) bLog(p.n + '이(가) 쓰러졌다');
  });
  bLog('그림자 · ' + atk.n + ' → ' + hitTxt.join(' · ') + ' 피해');
  BAT.guard = false;
  renderBattle();
  setTimeout(function () {
    if (BAT.enemy.stagger > 0) {
      BAT.enemy.stagger--;
      if (BAT.enemy.stagger <= 0) { BAT.enemy.brk = 0; BAT.enemy.brkMax += 55; }
    }
    var down = BAT.party.every(function (p) { return p.hp <= 0; });
    if (down) { finish('lose'); return; }
    endRound();
  }, 750);
}

function endRound() {
  BAT.turn++; BAT.act = 0; BAT.busy = false;
  updateWeak(); renderBattle();
  var e = BAT.enemy;
  var th = e.hp <= 180 ? 180 : (e.hp <= 330 ? 330 : (e.hp <= 500 ? 500 : 0));
  if (th && !BAT.talks[th]) { BAT.talks[th] = 1; setTimeout(function () { talkBattle(th); }, 320); return; }
}
var TALK = {
  500: { who: '그림자', t: '내 것이야. 버려진 거잖아. 아무도 안 찾아.', opts: [
    { t: '"버려진 게 아니야. 소미가 찾고 있어."', ok: true, r: '그림자의 목줄이 조금 느슨해진다.' },
    { t: '"네가 가져가면 더 잃어."', ok: false, r: '그림자가 더 조인다. 팔이 저리다.' },
    { t: '(아무 말도 하지 않는다)', ok: false, r: '그림자가 웃는다. 대답 없는 말은 힘이 없다.' }
  ] },
  330: { who: '그림자', t: '이름을 부르면 와. 그런데 나는 이름이 없어.', opts: [
    { t: '"이름을 줄게. 오늘부터."', ok: true, r: '목줄에 이름 하나가 걸린다.' },
    { t: '"이름 따위 필요 없어."', ok: false, r: '그림자가 목줄을 휘두른다.' },
    { t: '(뒤로 물러선다)', ok: false, r: '거리가 벌어진다. 힘도 벌어진다.' }
  ] },
  180: { who: '그림자', t: '목줄을 풀면 나는 없어져. 그래도 괜찮아.', opts: [
    { t: '"괜찮아. 대신 기억할게."', ok: true, r: '그림자가 처음으로 눈을 내리깐다.' },
    { t: '"그럼 풀어."', ok: false, r: '명령은 이름을 대신하지 못한다.' },
    { t: '(목줄을 당긴다)', ok: false, r: '목줄이 손을 파고든다.' }
  ] }
};
function talkBattle(th) {
  var d = TALK[th];
  var btns = d.opts.map(function (o, i) {
    return { t: o.t, fn: function () {
      closeModal();
      if (o.ok) { BAT.persuade = clamp(BAT.persuade + 2, 0, 9); BAT.gauge = clamp(BAT.gauge + 15, 0, 100); SFX.ok(); bLog('설득 +2 · ' + o.r); }
      else { var p = BAT.party.filter(function (x) { return x.hp > 0; })[0]; if (p) p.hp = Math.max(1, p.hp - 6); SFX.bad(); bLog(o.r); }
      renderBattle();
    } };
  });
  modal({ k: '전투 중 대화', t: d.who, d: '<span style="color:#ffd9a0">' + esc(d.t) + '</span>', btns: btns });
}

function capture() {
  if (BAT.over) return;
  BAT.over = true;
  SFX.win();
  setTimeout(function () { finish('capture'); }, 400);
}

async function finish(kind) {
  if (BAT.over && kind === 'win') return;
  BAT.over = true;
  var win = kind !== 'lose';
  if (!win) SFX.lose(); else SFX.win();
  await wait(400);
  if (kind === 'lose') { showResult(kind); return; }
  showResult(kind);
}

/* ---------------- 결과 / 엔딩 ---------------- */
function rankOf(kind) {
  if (kind === 'capture') return 'S';
  if (G.truth >= 95) return 'A';
  if (G.truth >= 75) return 'B';
  return 'C';
}
function showResult(kind) {
  G.phase = 'result';
  G.resultKind = kind;
  if (kind !== 'lose') { G.cp = 'ending'; saveSlot('auto'); }
  var r = rankOf(kind);
  var title = kind === 'capture' ? '포획 성공' : (kind === 'win' ? '격파 성공' : '패배');
  var msg = kind === 'capture'
    ? '목줄이 풀렸다. 그림자는 마지막으로 소미를 보고, 골목의 고양이들 사이로 스며들었다. 누리의 목줄만 바닥에 남았다.'
    : (kind === 'win' ? '그림자가 흩어졌다. 바닥에 목줄 하나가 떨어지고, 골목 안쪽에서 개 짖는 소리가 들린다.' : '시야가 하얗게 꺼졌다. 골목 소리만 남았다.');
  var rows = kind === 'lose' ? '' :
    '<div class="rp-rows">' +
    '<div class="rp-row"><span>진실 게이지</span><b>' + G.truth + '</b></div>' +
    '<div class="rp-row"><span>추리</span><b>' + G.combos.length + ' / 3</b></div>' +
    '<div class="rp-row"><span>모순 적중</span><b>' + G.strikes.length + ' / 3</b></div>' +
    '<div class="rp-row"><span>최종 설득</span><b class="gold">' + BAT.persuade + ' / 9</b></div>' +
    '</div>';
  var btns = kind === 'lose'
    ? '<button class="btn pri" id="rRetry">다시 싸운다</button><button class="btn ghost" id="rTitle">타이틀로</button>'
    : '<button class="btn pri" id="rNext">에필로그</button><button class="btn ghost" id="rTitle">타이틀로</button>';
  var o = $('#overlay');
  var bgc = 'background-image:linear-gradient(180deg,rgba(4,8,10,.84),rgba(4,8,10,.96)),url(' + IMG.bg_battle + ');';
  o.innerHTML = '<div class="rp on" style="position:absolute;' + bgc + '"><div class="rp-rank"><div class="r">' + (kind === 'lose' ? 'X' : r) + '</div><div class="l">RANK</div></div>' +
    '<div class="rp-t">' + title + '</div><div class="rp-s">제1화 · 문을 여는 값</div>' + rows +
    '<div class="rp-msg"><p>' + esc(msg) + '</p></div><div class="rp-btns">' + btns + '</div></div>';
  o.classList.add('on');
  var b1 = $('#rRetry'); if (b1) b1.onclick = function () { closeModal(); startBattle(); };
  var b2 = $('#rNext'); if (b2) b2.onclick = function () { closeModal(); playEpilogue(kind); };
  var b3 = $('#rTitle'); if (b3) b3.onclick = function () { closeModal(); G.battle = null; BAT = null; showTitle(); };
}

function playEpilogue(kind) {
  G.phase = 'ending'; G.cp = 'ending'; saveSlot('auto');
  var cap = kind === 'capture';
  var L = [
    { bg: 'bg_alley', tag: '후계동 골목 · 03:05', text: '새벽 세 시. 골목의 여섯 번째 전등이 켜졌다.' },
    { text: cap ? '누리가 골목 안쪽에서 걸어 나온다. 목줄은 없고, 대신 목덜미에 고양이 털이 몇 가닥 붙어 있다.' : '골목 안쪽 창고에서 누리가 나왔다. 목줄은 끊어져 있었다.' },
    { who: '소미', text: '누리야. 밥 먹자.' },
    { who: '김반장', text: '아이고. 이놈이 어디를 갔던 거야. 허리야.' },
    { who: '백 사장', text: '나는, 철거반에 보고할게. 개들은 내가 책임질게.' },
    { who: '박동훈', text: '책임은 말이 아니라 서류로 해요. 내일 아침, 관리사무소로 오세요.' },
    { who: '와타누키', text: '저, 저기요. 그런데 그 문은요. 아직 거기 있어요?' },
    { who: '유코', text: '문은 남아. 다음에 오는 사람을 위해서. 그게 문이 하는 일이야.' },
    { who: '도메키', text: '셀 필요 없어. 다만 잊지는 마.' },
    { who: '이지안', text: '아저씨. 오늘, 저 먼저 들어가도 돼요?' },
    { who: '박동훈', text: '그래. 대신 내일, 그 신발 신고 나와.' },
    { text: '골목의 전등이 하나씩 꺼진다. 순서는 다시 평범해졌다.' },
    { text: cap ? '어딘가에서 검은 고양이 한 마리가 목줄을 물고 담장을 넘었다.' : '까망이 담장 위에서 목줄을 물고 앉아 있었다.' }
  ];
  L.forEach(function (x) { if (x.who) pushLog(x.who, x.text); });
  scene(L, function () { showChapterEnd(kind); });
}

function showChapterEnd(kind) {
  G.phase = 'ending';
  var r = rankOf(kind);
  var o = $('#overlay');
  var bgc = 'background-image:linear-gradient(180deg,rgba(4,8,10,.82),rgba(4,8,10,.96)),url(' + IMG.bg_alley + ');';
  o.innerHTML = '<div class="rp on" style="position:absolute;' + bgc + '">' +
    '<div class="rp-rank"><div class="r">' + r + '</div><div class="l">CHAPTER CLEAR</div></div>' +
    '<div class="rp-t">제1화 완료</div><div class="rp-s">문을 여는 값 · ' + (kind === 'capture' ? '포획 루트' : '격파 루트') + '</div>' +
    '<div class="rp-rows"><div class="rp-row"><span>진실</span><b>' + G.truth + '</b></div>' +
    '<div class="rp-row"><span>단서</span><b>' + G.clues.length + ' / 5</b></div>' +
    '<div class="rp-row"><span>추리</span><b>' + G.combos.length + ' / 3</b></div>' +
    '<div class="rp-row"><span>모순</span><b>' + G.strikes.length + ' / 3</b></div></div>' +
    '<div class="rp-msg"><p><b style="color:#ffc85e">제2화 · 철거반의 명단</b></p><p>백 사장의 서류에는 이름이 하나 더 있었다. 골목에 문을 세운 사람. 유코는 그 이름을 이미 알고 있었다.</p></div>' +
    '<div class="rp-btns"><button class="btn pri" id="eSave">기록 저장</button><button class="btn" id="eAgain">다시 플레이</button><button class="btn ghost" id="eTitle">타이틀로</button></div></div>';
  o.classList.add('on');
  $('#eSave').onclick = function () { saveSlot('s1'); };
  $('#eAgain').onclick = function () { closeModal(); startPrologue(); };
  $('#eTitle').onclick = function () { closeModal(); showTitle(); };
}

/* ---------------- 메뉴 / 저장 UI ---------------- */
function openMenu() {
  $('#menuMask').classList.add('on');
  $('#mSfx').textContent = SFX.isOn() ? '음향 켜짐' : '음향 꺼짐';
}
function closeMenu() { $('#menuMask').classList.remove('on'); }

function slotLabel(s) {
  if (!s) return '빈 슬롯';
  var d = new Date(s.t);
  var hh = ('0' + d.getHours()).slice(-2), mm = ('0' + d.getMinutes()).slice(-2);
  var ph = { invest: '조사', note: '수첩', court: '증언', battle: '전투', 'ending': '에필로그', vn: '이야기', result: '결과' }[s.phase] || s.phase;
  return hh + ':' + mm + ' · ' + ph + ' · 진실 ' + s.truth;
}
function openSlots(mode) {
  var keys = mode === 'load' ? ['auto', 's1', 's2', 's3'] : ['s1', 's2', 's3'];
  var rows = keys.map(function (k) {
    var s = SAVED[k];
    var dis = (mode === 'load' && !s) ? ' disabled' : '';
    return '<button class="btn' + (s ? '' : ' ghost') + '" data-sl="' + k + '"' + dis + '>' +
      (k === 'auto' ? '자동 저장' : '슬롯 ' + k.slice(1)) + '<span class="n">' + slotLabel(s) + '</span></button>';
  }).join('');
  modal({ k: mode === 'load' ? 'LOAD' : 'SAVE', t: mode === 'load' ? '불러오기' : '저장하기', d: '<div style="display:flex;flex-direction:column;gap:7px">' + rows + '</div>', btns: [{ t: '닫기', fn: closeModal }] });
  Array.prototype.forEach.call($('#overlay').querySelectorAll('[data-sl]'), function (b) {
    b.onclick = function () {
      var k = b.dataset.sl;
      if (mode === 'save') { saveSlot(k); closeModal(); }
      else {
        if (!SAVED[k]) { toast('빈 슬롯입니다'); return; }
        var s = SAVED[k]; closeModal(); closeMenu();
        if (s.phase === 'battle' || s.cp === 'battle') { restorePhase(s); }
        else restorePhase(s);
      }
    };
  });
}
function restorePhase(s) {
  restore(s);
  if (s.cp === 'prologue') { startPrologue(); }
  else if (s.cp === 'invest') { startInvest(); }
  else if (s.cp === 'court') { startCourt(); }
  else if (s.cp === 'battle') { startBattle(); if (s.battle) { restore(s); refreshBattleSaved(); } }
  else if (s.cp === 'ending') { showChapterEnd(G.resultKind || 'win'); }
  else { startInvest(); }
  toast('불러왔습니다 · ' + slotLabel(s));
}
function refreshBattleSaved() {
  if (!BAT) return;
  renderBattle(true);
}

/* ---------------- 초기화 ---------------- */
function bindOnce() {
  $('#btnNew').onclick = function () { SFX.tap(); startPrologue(); };
  $('#btnContinue').onclick = function () {
    SFX.tap();
    var s = SAVED.auto || SAVED.s1;
    if (!s) { startPrologue(); return; }
    restorePhase(s);
  };
  $('#btnLoadSlot').onclick = function () { SFX.tap(); openSlots('load'); };
  $('#btnSfx').onclick = function () { toggleSfx(); };
  $('#btnMenu').onclick = function () { SFX.tap(); openMenu(); };
  $('#mClose').onclick = closeMenu;
  $('#mSave').onclick = function () { closeMenu(); openSlots('save'); };
  $('#mLoad').onclick = function () { closeMenu(); openSlots('load'); };
  $('#mSfx').onclick = function () { toggleSfx(); };
  $('#mTitle').onclick = function () { closeMenu(); showTitle(); };
  $('#menuMask').onclick = function (e) { if (e.target.id === 'menuMask') closeMenu(); };
  $('#panel').addEventListener('click', function (e) {
    if (e.target.closest('button')) return;
    if (G.view === 'vn') advance();
  });
  $('#art').addEventListener('click', function (e) {
    if (G.view === 'vn' && !e.target.closest('.hs')) advance();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { if (G.view === 'vn') { e.preventDefault(); advance(); } }
  });
  window.addEventListener('error', function (e) { window.__ERR = (window.__ERR || []).concat([String(e.message)]); });
}
function toggleSfx() {
  SFX.setOn(!SFX.isOn());
  $('#btnSfx').textContent = SFX.isOn() ? '음향 켜짐' : '음향 꺼짐';
  if ($('#mSfx')) $('#mSfx').textContent = SFX.isOn() ? '음향 켜짐' : '음향 꺼짐';
  toast(SFX.isOn() ? '음향을 켰습니다' : '음향을 껐습니다');
  try { localStorage.setItem('huky_sfx', SFX.isOn() ? '1' : '0'); } catch (e) {}
}

var booted = false;
function boot() {
  if (booted) return; booted = true;
  loadSaves();
  try { if (localStorage.getItem('huky_sfx') === '0') SFX.setOn(false); } catch (e) {}
  updateTruth();
  bindOnce();
  showTitle();
  window.__G = G; window.__BAT = function () { return BAT; }; window.__SAVED = SAVED;
}

document.addEventListener('DOMContentLoaded', boot);
if (document.readyState === 'interactive' || document.readyState === 'complete') { boot(); }

</script>
</body>
</html>
