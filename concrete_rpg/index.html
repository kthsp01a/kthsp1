<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04060a">
<title>새벽의 냄새길 — 슬라이스 A</title>
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<div id="app">
 <div id="column">
  <canvas id="scene"></canvas>
  <div id="grade"></div>
  <div id="crease"></div>

  <div id="hudTop">
    <div id="chapterMark"><b>SLICE A</b> · <span id="markText">서장 · 오래된 바다</span></div>
    <button id="btnLog" aria-label="대사 기록">대사 기록</button>
    <div id="beatPips"></div>
  </div>

  <div id="subtitle"><span class="sp"></span><span class="tx"></span><i class="late">자막</i></div>
  <div id="sceneHint"></div>
  <div id="gauges"></div>

  <div id="panel">
    <div id="panelTitle"><b>—</b></div>
    <div id="panelBody">
      <div id="threadStrip"></div>
    </div>
  </div>

  <div id="ringLayer"></div>

  <div id="board">
    <div class="map"><img id="boardMap" alt=""></div>
    <div id="boardHint">매듭을 끌어 물음표에 묶는다 · 실이 붙은 가설만 열린다</div>
    <svg id="boardSvg"></svg>
    <div id="hyps"></div>
    <button class="roundBtn ghost close" id="boardClose">닫기<small>장면으로</small></button>
  </div>

  <div id="logSheet">
    <header><span>대사 기록 · 놓친 대사는 눌러서</span><button id="logClose">닫기</button></header>
    <div id="logList"></div>
  </div>

  <div id="ending">
    <div class="kicker">SLICE A · END</div>
    <h2 id="endTitle">등을 돌린 밤</h2>
    <div class="rec" id="endRec"></div>
    <div class="next" id="endNext"></div>
    <div class="btns">
      <button id="endAgain">슬라이스 A 다시</button>
      <button id="endLog">대사 기록</button>
    </div>
  </div>

  <div id="title">
    <div class="kicker">콘크리트 정글 외전</div>
    <h1>새벽의 냄새길</h1>
    <div class="sub">슬라이스 A — 서장 오래된 바다 · 제1장 기다림 · 제2장 골목의 여왕<br>v3.6 마스터본 컷과 13역 음성으로</div>
    <button class="go" id="startBtn">눌러서 시작<small>소리를 켜고 시작합니다</small></button>
    <button class="resume" id="resumeBtn" hidden>이어서 계속</button>
    <div class="credit">권태홍 · 콘크리트 정글의 작은 영웅들 v3.6<br>음성·영상 원본 그대로 절출</div>
  </div>

  <div id="loader"><div class="ring"></div><span id="loaderText">준비 중</span></div>
 </div>
  <div id="cut">
    <video id="cutVideo" playsinline preload="auto"></video>
    <div class="cap" id="cutCap"></div>
    <div class="subs" id="cutSubs"></div>
    <button class="skip" id="cutSkip">건너뛰기</button>
    <div class="bar" id="cutBar"></div>
  </div>


</div>
<script src="app/app.js"></script>
</body>
</html>
